<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latency percentiles hide in the average</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Inter', sans-serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line · SRE Book · Figure 4-1</p>
    <h1>The average stays flat. The tail does not.</h1>

    <svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="latency-percentiles-title latency-percentiles-desc">
      <title id="latency-percentiles-title">The average stays flat. The tail does not.</title>
      <desc id="latency-percentiles-desc">Log-scale latency from 08:00 to 12:00. The 50th percentile stays near 50 ms while the 99th percentile spikes to 10 seconds after 10:30, which an average would hide.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text transform="rotate(-90 24 232)" x="24" y="232" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em" text-anchor="middle">LATENCY (MS) · LOG SCALE</text>

      <!-- Major log gridlines: 1, 10, 100, 1k, 10k -->
      <line x1="80" y1="424" x2="880" y2="424" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="328" x2="880" y2="328" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="232" x2="880" y2="232" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="136" x2="880" y2="136" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="880" y2="40"  stroke="rgba(45,49,66,0.06)" stroke-width="0.8"/>

      <!-- Axes -->
      <line x1="80" y1="40" x2="80" y2="424" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="80" y1="424" x2="880" y2="424" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <!-- Y-axis labels -->
      <text x="72" y="428" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">1</text>
      <text x="72" y="332" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">10</text>
      <text x="72" y="236" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">100</text>
      <text x="72" y="140" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">1k</text>
      <text x="72" y="44"  fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">10k</text>

      <!-- p50 series-1 sage -->
      <polyline points="80,260 180,256 280,260 380,256 480,260 580,256 680,256 780,256 880,260"
                fill="none" stroke="#7c8f6f" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- p85 series-2 dusty-blue -->
      <polyline points="80,168 180,164 280,164 380,164 480,164 580,164 680,164 780,160 880,164"
                fill="none" stroke="#5e7a9b" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- p95 series-3 mustard -->
      <polyline points="80,128 180,124 280,116 380,104 480,120 580,112 680,96 780,104 880,108"
                fill="none" stroke="#b8915a" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- p99 FOCAL accent -->
      <polyline points="80,76 180,72 280,72 380,64 480,76 580,44 680,60 780,40 880,52"
                fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="80"  cy="76" r="4" fill="#eb6c36"/>
      <circle cx="180" cy="72" r="4" fill="#eb6c36"/>
      <circle cx="280" cy="72" r="4" fill="#eb6c36"/>
      <circle cx="380" cy="64" r="4" fill="#eb6c36"/>
      <circle cx="480" cy="76" r="4" fill="#eb6c36"/>
      <circle cx="580" cy="44" r="4" fill="#eb6c36"/>
      <circle cx="680" cy="60" r="4" fill="#eb6c36"/>
      <circle cx="780" cy="40" r="4" fill="#eb6c36"/>
      <circle cx="880" cy="52" r="4" fill="#eb6c36"/>

      <!-- End-of-line percentile labels -->
      <rect x="888" y="248" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="892" y="260" fill="#7c8f6f" font-size="12" font-weight="600" font-family="'Inter', sans-serif">p50</text>
      <rect x="888" y="152" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="892" y="164" fill="#5e7a9b" font-size="12" font-weight="600" font-family="'Inter', sans-serif">p85</text>
      <rect x="888" y="96" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="892" y="108" fill="#b8915a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">p95</text>
      <rect x="888" y="40" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="892" y="52" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Inter', sans-serif">p99</text>

      <!-- Callout: average tracks p50 -->
      <text x="200" y="320" fill="#2d3142" font-size="14" font-style="italic" font-family="'Inter', sans-serif">what an average reports</text>
      <path d="M 280 312 Q 260 292 200 264" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="200" cy="256" r="2" fill="#2d3142"/>

      <!-- Callout: tail spike -->
      <text x="640" y="24" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Inter', sans-serif">tail hits 10s after 10:30</text>
      <path d="M 720 28 Q 680 32 600 40" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="580" cy="44" r="2" fill="#eb6c36"/>

      <!-- X-axis labels -->
      <text x="80"  y="444" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">08:00</text>
      <text x="180" y="444" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">08:30</text>
      <text x="280" y="444" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">09:00</text>
      <text x="380" y="444" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">09:30</text>
      <text x="480" y="444" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">10:00</text>
      <text x="580" y="444" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">10:30</text>
      <text x="680" y="444" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">11:00</text>
      <text x="780" y="444" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">11:30</text>
      <text x="880" y="444" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">12:00</text>

      <!-- Legend -->
      <line x1="40" y1="468" x2="1000" y2="468" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="488" fill="#4f5d75" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="508" width="16" height="8" fill="#7c8f6f"/>
      <text x="64" y="516" fill="#4f5d75" font-size="8" font-family="'Inter', sans-serif">p50 · ~50 ms</text>

      <rect x="200" y="508" width="16" height="8" fill="#5e7a9b"/>
      <text x="224" y="516" fill="#4f5d75" font-size="8" font-family="'Inter', sans-serif">p85 · ~500 ms</text>

      <rect x="380" y="508" width="16" height="8" fill="#b8915a"/>
      <text x="404" y="516" fill="#4f5d75" font-size="8" font-family="'Inter', sans-serif">p95 · 1–2 s</text>

      <rect x="540" y="508" width="16" height="8" fill="#eb6c36"/>
      <text x="564" y="516" fill="#4f5d75" font-size="8" font-family="'Inter', sans-serif">p99 · 4–10 s · focal</text>
    </svg>
  </div>
</body>
</html>
