<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SLI vs SLO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --grid:rgba(255,255,255,0.045);
    --panel:#111C2E;
    --panel-border:#26374F;
    --text:#E7EDF6;
    --text-dim:#8FA1BC;
    --req:#5EEAD4;
    --res:#FBBF24;
    --gslb:#F472B6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/40px 40px,
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1440px; margin:0 auto;}
  header{margin-bottom:22px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--req); margin-bottom:8px;
  }
  h1{
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:clamp(24px,4vw,34px);
    letter-spacing:-0.01em;
  }
  .sub{color:var(--text-dim); font-size:14px; margin-top:8px; max-width:720px; line-height:1.5;}

  .layout{display:grid; grid-template-columns:1fr; gap:18px; margin-top:24px; align-items:start;}
  @media(min-width:1100px){ .layout{grid-template-columns: 2.4fr 1fr;} }

  .stage{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:10px;
    padding:14px; overflow:hidden;
  }
  svg{width:100%; height:auto; display:block;}

  .layer{opacity:0; pointer-events:none; transition:opacity 0.35s ease;}
  .layer.on{opacity:1; pointer-events:auto;}

  .side{display:flex; flex-direction:column; gap:14px;}
  .card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:16px;
  }
  .step-tag{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--req);
    letter-spacing:0.08em; text-transform:uppercase; margin-bottom:6px;
  }
  .step-title{font-size:18px; font-weight:700; margin-bottom:8px; line-height:1.3;}
  .step-desc{font-size:14px; color:var(--text-dim); line-height:1.55;}

  .controls{display:flex; gap:8px; margin-top:16px;}
  button{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.04em;
    background:#16283F; color:var(--text); border:1px solid var(--panel-border);
    border-radius:6px; padding:9px 14px; cursor:pointer; transition:all 0.15s;
  }
  button:hover:not(:disabled){border-color:var(--req); color:var(--req);}
  button:disabled{opacity:0.35; cursor:not-allowed;}
  button.primary{background:var(--req); color:#08131f; border-color:var(--req); font-weight:700;}
  button.primary:hover{filter:brightness(1.08);}

  .progress{display:flex; gap:5px; margin-top:14px; flex-wrap:wrap;}
  .progress span{
    width:100%; max-width:16px; height:5px; border-radius:3px; background:#233149; cursor:pointer;
  }
  .progress span.done{background:var(--req);}
  .progress span.now{outline:2px solid #fff; outline-offset:1px;}

  .legend{
    display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--text-dim);
    margin-top:12px; font-family:'JetBrains Mono',monospace;
  }
  .legend span{display:flex; align-items:center; gap:6px;}
  .swatch{width:16px; height:3px; border-radius:2px; display:inline-block;}

  footer{margin-top:22px; font-size:12px; color:var(--text-dim); text-align:center;}
  footer a{color:var(--req);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Google SRE Workbook · Indicators and objectives</div>
    <h1>SLI vs SLO</h1>
    <p class="sub">The SLI is the ruler (what you count). The SLO is the mark on the ruler (what you promised). You cannot have a mark without a ruler.</p>
  </header>

  <div class="layout">
    <div class="stage">
      <svg viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vs-title vs-desc">
        <title id="vs-title">SLI vs SLO</title>
        <desc id="vs-desc">An SLI is the measurement. An SLO is a target on that measurement. Three paired examples, then one ruler with two marks.</desc>

        <g id="defs" class="layer">
          <rect x="40" y="40" width="480" height="280" rx="10" fill="#0F1A2B" stroke="#5EEAD4" stroke-width="1.6"/>
          <text x="60" y="78" fill="#5EEAD4" font-size="16" font-family="'JetBrains Mono', monospace">SLI · THE RULER</text>
          <text x="60" y="118" fill="#E7EDF6" font-size="18" font-family="'Inter', sans-serif">What number are we reading?</text>
          <text x="60" y="160" fill="#8FA1BC" font-size="15" font-family="'Inter', sans-serif">A count, a rate, or a percentile.</text>
          <text x="60" y="188" fill="#8FA1BC" font-size="15" font-family="'Inter', sans-serif">Example: share of writes that succeed.</text>
          <text x="60" y="230" fill="#E7EDF6" font-size="22" font-family="'JetBrains Mono', monospace">today: 99.7%</text>
          <text x="60" y="268" fill="#8FA1BC" font-size="15" font-family="'Inter', sans-serif">That is a reading. Not yet a miss.</text>

          <rect x="560" y="40" width="500" height="280" rx="10" fill="#16283F" stroke="#FBBF24" stroke-width="1.6"/>
          <text x="580" y="78" fill="#FBBF24" font-size="16" font-family="'JetBrains Mono', monospace">SLO · THE MARK</text>
          <text x="580" y="118" fill="#E7EDF6" font-size="18" font-family="'Inter', sans-serif">What number did we promise?</text>
          <text x="580" y="160" fill="#8FA1BC" font-size="15" font-family="'Inter', sans-serif">The same SLI, plus a comparison, plus a number.</text>
          <text x="580" y="188" fill="#8FA1BC" font-size="15" font-family="'Inter', sans-serif">Promise: at least 99.9% succeed.</text>
          <text x="580" y="230" fill="#E7EDF6" font-size="22" font-family="'JetBrains Mono', monospace">99.7% &lt; 99.9%  →  miss</text>
          <text x="580" y="268" fill="#8FA1BC" font-size="15" font-family="'Inter', sans-serif">Green or red only after the mark exists.</text>
        </g>

        <g id="pairs" class="layer">
          <rect x="40" y="40" width="1020" height="70" rx="8" fill="#0F1A2B" stroke="#26374F"/>
          <text x="60" y="68" fill="#5EEAD4" font-size="13" font-family="'JetBrains Mono', monospace">SLI</text>
          <text x="60" y="92" fill="#E7EDF6" font-size="15" font-family="'Inter', sans-serif">Share of writes that succeed</text>
          <text x="620" y="68" fill="#FBBF24" font-size="13" font-family="'JetBrains Mono', monospace">SLO</text>
          <text x="620" y="92" fill="#E7EDF6" font-size="15" font-family="'Inter', sans-serif">At least 99.9% succeed</text>

          <rect x="40" y="126" width="1020" height="70" rx="8" fill="#0F1A2B" stroke="#26374F"/>
          <text x="60" y="154" fill="#5EEAD4" font-size="13" font-family="'JetBrains Mono', monospace">SLI</text>
          <text x="60" y="178" fill="#E7EDF6" font-size="15" font-family="'Inter', sans-serif">Time from click to last byte, small writes</text>
          <text x="620" y="154" fill="#FBBF24" font-size="13" font-family="'JetBrains Mono', monospace">SLO</text>
          <text x="620" y="178" fill="#E7EDF6" font-size="15" font-family="'Inter', sans-serif">99 of 100 finish in 50 ms or less</text>

          <rect x="40" y="212" width="1020" height="70" rx="8" fill="#0F1A2B" stroke="#26374F"/>
          <text x="60" y="240" fill="#5EEAD4" font-size="13" font-family="'JetBrains Mono', monospace">SLI</text>
          <text x="60" y="264" fill="#E7EDF6" font-size="15" font-family="'Inter', sans-serif">Time from job start to file in the inbox</text>
          <text x="620" y="240" fill="#FBBF24" font-size="13" font-family="'JetBrains Mono', monospace">SLO</text>
          <text x="620" y="264" fill="#E7EDF6" font-size="15" font-family="'Inter', sans-serif">999 of 1,000 finish by 08:00</text>

          <rect x="40" y="298" width="1020" height="70" rx="8" fill="#0F1A2B" stroke="#26374F"/>
          <text x="60" y="326" fill="#5EEAD4" font-size="13" font-family="'JetBrains Mono', monospace">SLI</text>
          <text x="60" y="350" fill="#E7EDF6" font-size="15" font-family="'Inter', sans-serif">Share of photos that still read back next year</text>
          <text x="620" y="326" fill="#FBBF24" font-size="13" font-family="'JetBrains Mono', monospace">SLO</text>
          <text x="620" y="350" fill="#E7EDF6" font-size="15" font-family="'Inter', sans-serif">At least 99.99% still readable after 365 days</text>
        </g>

        <g id="twomarks" class="layer">
          <text x="60" y="56" fill="#8FA1BC" font-size="14" font-family="'JetBrains Mono', monospace">ONE SLI · TWO SLOS</text>
          <text x="60" y="86" fill="#E7EDF6" font-size="16" font-family="'Inter', sans-serif">Same ruler: how long a write takes. Two marks, because two customers.</text>
          <line x1="80" y1="180" x2="1020" y2="180" stroke="#2A3B55" stroke-width="6" stroke-linecap="round"/>
          <circle cx="200" cy="180" r="10" fill="#5EEAD4"/>
          <circle cx="820" cy="180" r="10" fill="#FBBF24"/>
          <text x="200" y="150" fill="#5EEAD4" font-size="14" font-family="'JetBrains Mono', monospace" text-anchor="middle">10 ms</text>
          <text x="820" y="150" fill="#FBBF24" font-size="14" font-family="'JetBrains Mono', monospace" text-anchor="middle">1 s</text>
          <text x="200" y="230" fill="#5EEAD4" font-size="14" font-family="'Inter', sans-serif" text-anchor="middle">Click SLO</text>
          <text x="200" y="252" fill="#8FA1BC" font-size="14" font-family="'Inter', sans-serif" text-anchor="middle">99 of 100 small writes</text>
          <text x="200" y="274" fill="#8FA1BC" font-size="14" font-family="'Inter', sans-serif" text-anchor="middle">in 10 ms or less</text>
          <text x="820" y="230" fill="#FBBF24" font-size="14" font-family="'Inter', sans-serif" text-anchor="middle">Pipeline SLO</text>
          <text x="820" y="252" fill="#8FA1BC" font-size="14" font-family="'Inter', sans-serif" text-anchor="middle">95 of 100 writes</text>
          <text x="820" y="274" fill="#8FA1BC" font-size="14" font-family="'Inter', sans-serif" text-anchor="middle">in 1 s or less</text>
          <text x="550" y="340" fill="#8FA1BC" font-size="14" font-family="'Inter', sans-serif" text-anchor="middle">Incoming requests per second is also an SLI. Users pick that number, so it usually gets no SLO.</text>
        </g>
      </svg>
      <div class="legend">
        <span><i class="swatch" style="background:var(--req)"></i>SLI, the ruler</span>
        <span><i class="swatch" style="background:var(--res)"></i>SLO, the mark</span>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="step-tag" id="stepTag">Step 1 of 3</div>
        <div class="step-title" id="stepTitle"></div>
        <div class="step-desc" id="stepDesc"></div>
        <div class="controls">
          <button id="prevBtn">◀ Back</button>
          <button id="nextBtn" class="primary">Next ▶</button>
          <button id="playBtn">▶ Play</button>
        </div>
        <div class="progress" id="progress"></div>
      </div>
    </div>
  </div>

  <footer>Chapter 4 · Service Level Objectives · <a href="https://sre.google/sre-book/service-level-objectives/">book chapter</a></footer>
</div>

<script>
const steps = [
  {
    title: 'The ruler, then the mark',
    desc: 'SLI means service level indicator: the measurement. Today 99.7% of writes succeed. That is a reading. SLO means service level objective: the promise on that same measurement. If the promise is 99.9%, then 99.7% is a miss. No mark, no miss.',
    on: ['defs']
  },
  {
    title: 'Each SLO sits on one SLI',
    desc: 'Same row: what you count, then what you promised. Did the write work. Was the click fast. Did the nightly file arrive. Is the photo still there next year. You cannot write the right-hand promise until you can count the left-hand number.',
    on: ['pairs']
  },
  {
    title: 'One ruler can hold two marks',
    desc: 'Write latency is one SLI. The click mark is 10 ms. The pipeline mark is 1 s. Incoming requests per second is also an SLI. Users choose how many arrive, so that graph usually has no SLO.',
    on: ['twomarks']
  }
];

let current = 0;
let playing = false;
let playTimer = null;

const ids = ['defs','pairs','twomarks'];
const els = {};
ids.forEach(id => { els[id] = document.getElementById(id); });

const progressEl = document.getElementById('progress');
steps.forEach((s,i)=>{
  const d = document.createElement('span');
  d.addEventListener('click', ()=> goTo(i));
  progressEl.appendChild(d);
});

function render(){
  const s = steps[current];
  ids.forEach(id => {
    els[id].classList.remove('on');
    if(s.on.includes(id)) els[id].classList.add('on');
  });

  document.getElementById('stepTag').textContent = 'Step ' + (current+1) + ' of ' + steps.length;
  document.getElementById('stepTitle').textContent = s.title;
  document.getElementById('stepDesc').textContent = s.desc;

  [...progressEl.children].forEach((d,i)=>{
    d.classList.toggle('now', i===current);
    d.classList.toggle('done', i<=current);
  });

  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===steps.length-1;
}

function goTo(i){
  current = Math.max(0, Math.min(steps.length-1, i));
  render();
}

document.getElementById('nextBtn').addEventListener('click', ()=> goTo(current+1));
document.getElementById('prevBtn').addEventListener('click', ()=> goTo(current-1));

const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', ()=>{
  if(playing){
    playing=false; clearInterval(playTimer); playBtn.textContent='▶ Play';
    return;
  }
  playing=true; playBtn.textContent='⏸ Pause';
  playTimer = setInterval(()=>{
    if(current>=steps.length-1){
      playing=false; clearInterval(playTimer); playBtn.textContent='▶ Play';
      return;
    }
    goTo(current+1);
  }, 2200);
});

render();
</script>
</body>
</html>
